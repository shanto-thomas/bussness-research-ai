[project]
name = "business-research-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shanto.ts", email = "shanto.ts@pitsolutions.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
    "reportlab>=5.0.1",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
business-research-ai = "business_research_ai:main"

[tool.hatch.build.targets.wheel]
packages = ["src/business_research_ai"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
